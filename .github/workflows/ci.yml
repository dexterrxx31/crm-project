name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Owner and app roles for the throwaway CI database — see lib/db/migrate.ts
  # for why migrations need DATABASE_ADMIN_URL and the app needs the
  # non-superuser DATABASE_URL.
  DATABASE_URL: postgresql://synapse_app:synapse_app@localhost:5432/synapse
  DATABASE_ADMIN_URL: postgresql://synapse:synapse@localhost:5432/synapse
  BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else
  BETTER_AUTH_URL: http://localhost:3000

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector image, not plain postgres — the embeddings table declares
        # a vector(1024) column and migrations CREATE EXTENSION vector.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synapse -d synapse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migrations, RLS policies and role grants
        run: bun run db:migrate

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (Biome)
        run: bun run lint

      - name: Unit tests (Vitest)
        run: bun run test

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        # AI/rate-limit/observability env vars are deliberately left unset —
        # every path they gate must degrade gracefully without them (see
        # AGENTS.md), and the golden-path test asserts that degradation
        # directly rather than requiring live third-party credentials in CI.
        run: bun run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
